name: Unpack ParuGram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          set -e
          unzip -o ParuGram-GitHub-BuildKit-v0.3.zip -d _unpack
          cp -a _unpack/ParuGram-GitHub-BuildKit/. ./
          rm -rf _unpack
          rm -f ParuGram-GitHub-BuildKit-v0.3.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack ParuGram build kit"
          git push
